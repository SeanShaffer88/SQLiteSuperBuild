# Release workflow — builds the pinned SQLite bundle and attaches it
# to the GitHub Release for the pushed version tag. The release
# itself (tag + notes) is created in the GitHub web UI; this workflow
# only builds and uploads the zip. Binaries are unsigned.
name: release
on:
  push:
    tags: ["v*"]
jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned sources (SHA-256 verified)
        run: ./fetch.ps1
      - name: Build dll + shell + vec0
        run: ./build.ps1
      - name: Package x64 zip
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}"
          $stage = "pkg/SQLiteSuperBuild-$ver-x64"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item "dist/sqlite3.dll" $stage
          Copy-Item "dist/sqlite3.lib" $stage
          Copy-Item "dist/vec0.dll" $stage
          Copy-Item "vendor/src-sqlite/sqlite3.h" $stage
          Copy-Item LICENSE $stage
          Copy-Item SQLITE_LICENSE.txt $stage
          Copy-Item README.md $stage
          Compress-Archive -Path "$stage/*" -DestinationPath "SQLiteSuperBuild-$ver-x64.zip"
      - uses: softprops/action-gh-release@v2
        with:
          files: "*.zip"
