# CI for SQLiteSuperBuild (custom: fetch -> build -> export lists -> harness).
# Canonical workflow file. A copy is kept at the repo root (ci.yml) for
# reference; keep the two in sync.
name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned sources (SHA-256 verified)
        shell: pwsh
        run: ./fetch.ps1
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Build dll + shell + vec0
        shell: pwsh
        run: ./build.ps1
      - name: Generate export lists from the built DLLs
        shell: pwsh
        run: |
          ./tools/gen_def.ps1 dist/sqlite3.dll dist/sqlite3.def
          ./tools/gen_def.ps1 dist/vec0.dll dist/vec0.def sqlite3_vec
      - name: Debug comment test
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$env:GITHUB_REPOSITORY/issues/1/comments" -X POST -H "Authorization: Bearer $env:GH_TOKEN" -f body="debug test from CI"
      - name: Debug publish generated defs
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          try {
            git config user.name "github-actions[bot]"
            git config user.email "actions@github.com"
            git checkout -b debug-defs
            Copy-Item dist/sqlite3.def windows-sqlite3.def
            Copy-Item dist/vec0.def windows-vec0.def
            git add windows-sqlite3.def windows-vec0.def
            git commit -m "debug: windows defs"
            git push origin debug-defs
          } catch {
            $msg = "debug-defs error: $($_.Exception.Message)"
            gh api "repos/$env:GITHUB_REPOSITORY/issues/1/comments" -X POST -H "Authorization: Bearer $env:GH_TOKEN" -f body="$msg"
            throw
          }
      - name: Checked-in export lists match the built DLLs
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          function Get-DefSymbols($path) {
              Get-Content $path | Where-Object { $_ -notmatch '^;' -and $_.Trim() -ne '' -and $_ -ne 'EXPORTS' }
          }
          $a1 = @(Get-DefSymbols sqlite3.def | Sort-Object)
          $b1 = @(Get-DefSymbols dist/sqlite3.def | Sort-Object)
          $d1 = @(Compare-Object $a1 $b1)
          $a2 = @(Get-DefSymbols vec0.def | Sort-Object)
          $b2 = @(Get-DefSymbols dist/vec0.def | Sort-Object)
          $d2 = @(Compare-Object $a2 $b2)
          if ($d1 -or $d2) {
            $msg = "sqlite3 diff count=$($d1.Count) first=$($d1 | Select-Object -First 6 | Out-String) vec0 diff count=$($d2.Count) first=$($d2 | Select-Object -First 6 | Out-String)"
            gh api "repos/$env:GITHUB_REPOSITORY/issues/1/comments" -X POST -H "Authorization: Bearer $env:GH_TOKEN" -f body="$msg"
            throw "defs are stale"
          }
      - name: Feature harness against the built DLL
        shell: pwsh
        run: |
          cl /nologo /O2 /MD /DSQLITE_ENABLE_SESSION test/test_superbuild.c /I vendor/src-sqlite /Fe:test_sb.exe /link dist/sqlite3.lib
          $env:PATH = "$PWD/dist;$env:PATH"
          ./test_sb.exe dist/vec0.dll test_sb_tmp.db
          if ($LASTEXITCODE -ne 0) { throw "feature harness failed" }
      - name: Shell smoke
        shell: pwsh
        run: |
          $v = ./dist/sqlite3.exe --version
          Write-Host $v
          if ($v -notmatch '^3\.54\.1 ') { throw "unexpected shell version: $v" }
      - uses: actions/upload-artifact@v4
        with:
          name: sqlite-superbuild-windows-x64
          path: |
            dist/sqlite3.dll
            dist/sqlite3.lib
            dist/sqlite3.exe
            dist/vec0.dll
            sqlite3.def
            vec0.def
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned sources (SHA-256 verified)
        run: sh ./fetch.sh
      - name: Build
        run: sh ./build.sh
      - name: Generate export lists and compare with the checked-in defs
        run: |
          sh tools/gen_def.sh dist/libsqlite3.so /tmp/sqlite3.def
          sh tools/gen_def.sh dist/vec0.so /tmp/vec0.def sqlite3_vec
          # The checked-in defs are generated from the Windows DLLs and also
          # list the Windows-only sqlite3_win32_* helpers. Compare the symbols
          # that must be present on both platforms.
          grep -v '^sqlite3_win32_' sqlite3.def | grep -v '^;' | grep -v '^EXPORTS' | grep -v '^$' | sort > /tmp/checked.syms
          grep -v '^;' /tmp/sqlite3.def | grep -v '^EXPORTS' | grep -v '^$' | sort > /tmp/generated.syms
          diff -u /tmp/checked.syms /tmp/generated.syms
          grep -v '^;' vec0.def | grep -v '^EXPORTS' | grep -v '^$' | sort > /tmp/checked.vec.syms
          grep -v '^;' /tmp/vec0.def | grep -v '^EXPORTS' | grep -v '^$' | sort > /tmp/generated.vec.syms
          diff -u /tmp/checked.vec.syms /tmp/generated.vec.syms
      - name: Feature harness
        run: |
          cc -O2 -DSQLITE_ENABLE_SESSION -I vendor/src-sqlite test/test_superbuild.c -o /tmp/test_sb -L dist -lsqlite3 -lm -lpthread
          LD_LIBRARY_PATH=dist /tmp/test_sb dist/vec0.so /tmp/sb_tmp.db
      - name: Shell smoke
        run: |
          v=$(./dist/sqlite3 --version)
          echo "$v"
          case "$v" in 3.54.1*) ;; *) echo "unexpected shell version: $v"; exit 1;; esac
